    <line x1="13" y1="33" x2="13" y2="47"/>
    <line x1="23" y1="24" x2="23" y2="56"/>
    <line x1="32" y1="30" x2="32" y2="50"/>
    <line x1="40" y1="37" x2="40" y2="43"/>
    <line x1="49" y1="18" x2="49" y2="56"/>
    <line x1="58" y1="28" x2="58" y2="52"/>
    <line x1="67" y1="34" x2="67" y2="46"/>
  </g>
